name: Build AAB

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        required: true
      version_bump:
        type: string
        required: true
      vcode_bump:
        type: boolean
        required: true

env:
  UNITY_EXE: 'C:\Program Files\Unity\Hub\Editor\2022.3.47f1\Editor\Unity.exe'

jobs:
  build-aab:
    name: Build AAB
    runs-on: [self-hosted, windows]
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          lfs: false
          clean: false

      - name: Restore keystore
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force keys | Out-Null
          $bytes = [Convert]::FromBase64String("${{ secrets.ANDROID_KEYSTORE_BASE64 }}")
          [IO.File]::WriteAllBytes("${{ github.workspace }}\keys\user.keystore", $bytes)

      - name: Backdate Editor scripts to prevent recompile
        shell: powershell
        run: |
          $dllPath = "${{ github.workspace }}\Library\ScriptAssemblies\ScriptsEditor.dll"
          if (Test-Path $dllPath) {
            $dllTime = (Get-Item $dllPath).LastWriteTime.AddSeconds(-10)
            Get-ChildItem "${{ github.workspace }}\Assets\Scripts\Editor" -Filter "*.cs" | ForEach-Object {
              $_.LastWriteTime = $dllTime
            }
            Write-Host "Backdated Editor .cs files to $dllTime"
          } else {
            Write-Host "ScriptsEditor.dll not found, skipping backdate"
          }

      - name: Kill lingering Unity processes
        shell: powershell
        run: |
          $workspace = "${{ github.workspace }}"
          Get-Process -Name "Unity","AssetImportWorker*","UnityCrashHandler*" -ErrorAction SilentlyContinue | ForEach-Object {
            $cmdline = (Get-CimInstance Win32_Process -Filter "ProcessId=$($_.Id)" -ErrorAction SilentlyContinue).CommandLine
            if ($cmdline -like "*$workspace*") {
              Write-Host "Killing $($_.Name) (PID $($_.Id))"
              Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
            }
          }
          Remove-Item -Force -ErrorAction SilentlyContinue "${{ github.workspace }}\Temp\UnityLockfile"
          Remove-Item -Force -ErrorAction SilentlyContinue "${{ github.workspace }}\Temp\workerlic"

      - name: Clean previous AAB builds
        shell: powershell
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "${{ github.workspace }}\Build\Android"

      - name: Build AAB
        shell: powershell
        run: |
          $log = "${{ github.workspace }}\unity-aab.log"
          $proc = Start-Process -FilePath $env:UNITY_EXE -ArgumentList @(
            "-batchmode", "-nographics",
            "-projectPath", "${{ github.workspace }}",
            "-buildTarget", "Android",
            "-executeMethod", "CIBuild.Build",
            "-logFile", $log,
            "-outputPath", "Build/Android/",
            "-bumpType", "${{ inputs.version_bump }}",
            "-keystorePath", "keys/user.keystore",
            "-keystorePass", "${{ secrets.ANDROID_KEYSTORE_PASS }}",
            "-keyAlias", "${{ secrets.ANDROID_KEY_ALIAS }}",
            "-keyPass", "${{ secrets.ANDROID_KEY_PASS }}"
          ) -PassThru -Wait
          $exitCode = $proc.ExitCode
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Upload Unity log
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: unity-aab-log
          path: unity-aab.log
          retention-days: 3

      - name: Remove keystore
        if: always()
        shell: powershell
        run: Remove-Item -Force -ErrorAction SilentlyContinue "${{ github.workspace }}\keys\user.keystore"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-aab
          path: Build/Android/**/*.aab
          retention-days: 7

      - name: Read bumped version
        id: version
        shell: powershell
        run: |
          $content = Get-Content "ProjectSettings/ProjectSettings.asset" -Raw
          $version = ($content | Select-String 'bundleVersion: (\S+)').Matches[0].Groups[1].Value
          $vcode = ($content | Select-String 'AndroidBundleVersionCode: (\d+)').Matches[0].Groups[1].Value
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "vcode=$vcode" >> $env:GITHUB_OUTPUT

      - name: Commit version bump to main
        if: ${{ !inputs.dry_run && inputs.version_bump != 'none' }}
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ProjectSettings/ProjectSettings.asset
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "chore(release): bump version to ${{ steps.version.outputs.version }} (vcode ${{ steps.version.outputs.vcode }})"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
          }

      - name: Discord notify
        if: always()
        shell: powershell
        run: |
          $status = if ("${{ job.status }}" -eq "success") { "v" } else { "x" }
          $label = if ("${{ job.status }}" -eq "success") { "성공" } else { "실패" }
          $color = if ("${{ job.status }}" -eq "success") { 3066993 } else { 15158332 }
          $json = [System.Text.Encoding]::UTF8.GetBytes(@"
          {"embeds":[{"title":"[$status] AAB 빌드 $label","color":$color,"fields":[{"name":"버전","value":"${{ steps.version.outputs.version }} (vcode ${{ steps.version.outputs.vcode }})","inline":true},{"name":"Bump","value":"${{ inputs.version_bump }}","inline":true},{"name":"Dry run","value":"${{ inputs.dry_run }}","inline":true}],"url":"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}]}
          "@.Trim())
          $wc = New-Object System.Net.WebClient
          $wc.Headers.Add("Content-Type", "application/json; charset=utf-8")
          $wc.UploadData("${{ secrets.DISCORD_WEBHOOK_URL }}", "POST", $json) | Out-Null
